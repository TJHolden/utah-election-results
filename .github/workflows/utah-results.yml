name: Pull Utah official results

# GitHub's scheduler was not firing at all on election night — 30 minutes after
# this workflow was added, zero scheduled runs had started, because `schedule`
# is delayed hard under load and every-5-minutes lands on the busiest slots.
# So the refresh does not depend on it: one dispatched run loops on its own
# clock for hours. The cron below is only a backstop for after that ends.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run keeps polling (minutes)"
        default: "300"
      interval:
        description: "Seconds between pulls"
        default: "120"
  schedule:
    - cron: "13,43 * * * *"   # backstop only, off the busy 5-minute boundaries

permissions:
  contents: write

concurrency:
  group: utah-results
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Pull the Lt. Governor's feed until the deadline
        env:
          MINUTES: ${{ github.event.inputs.minutes || '1' }}
          INTERVAL: ${{ github.event.inputs.interval || '120' }}
        run: |
          set -u
          git config user.name  "utah-results-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date +%s) + MINUTES * 60 ))
          n=0
          while :; do
            n=$((n+1))
            echo "--- pull #$n at $(date -u +%H:%M:%SZ) ---"
            python3 tools/pull_utah.py || echo "pull failed, will retry next cycle"
            if [ -n "$(git status --porcelain results.json)" ]; then
              MSG=$(python3 -c "import json;d=json.load(open('results.json'));print(f\"Utah results: {d['totalVotes']:,} votes, as of {d['asOf']}\")")
              git add results.json
              git commit -q -m "$MSG"
              git pull --rebase --autostash -q || true
              git push -q || echo "push failed, will retry next cycle"
              echo "committed: $MSG"
            else
              echo "no change"
            fi
            [ "$(date +%s)" -ge "$END" ] && break
            sleep "$INTERVAL"
          done
          echo "finished after $n pulls"
