name: Pull Utah official results

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a scheduled run under load)
  workflow_dispatch:         # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: utah-results
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the Lt. Governor's feed
        run: python3 tools/pull_utah.py

      - name: Commit if the numbers moved
        run: |
          if [ -n "$(git status --porcelain results.json)" ]; then
            git config user.name  "utah-results-bot"
            git config user.email "actions@users.noreply.github.com"
            git add results.json
            git commit -m "Utah results: $(python3 -c "import json;d=json.load(open('results.json'));print(f\"{d['totalVotes']:,} votes, as of {d['asOf']}\")")"
            git push
          else
            echo "No change in results.json"
          fi
